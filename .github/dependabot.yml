# Mises a jour hebdomadaires, groupees, soumises a la meme CI que le reste.
# Une PR Dependabot n'est jamais fusionnee sans CI verte ni relecture.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
