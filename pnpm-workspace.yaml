packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  # ADR-0015 : postinstall de protobufjs (tire par inngest via OpenTelemetry
  # gRPC) ; il ne sert que l'outillage en ligne de commande de protobufjs,
  # inutile ici. Refuse.
  protobufjs: false
  sharp: true
  # ADR-0009 : postinstall de repli qui telecharge le binding natif si la
  # dependance optionnelle de plateforme manque ; elle est installee, le
  # script n'a pas a s'executer.
  unrs-resolver: false
overrides:
  postcss: ">=8.5.23"
  kysely: ">=0.28.17"
  esbuild: ">=0.25.0"
  # GHSA-68fv-2mgg-jv7q : deni de service par offsets de sections (via postcss).
  source-map-js: ">=1.2.2"
  # GHSA-wq5f-xc86-pv6w : CVE-2026-96889 dans librsvg embarque (via next).
  sharp: ">=0.35.5"
  # GHSA-587h-7wmj-h5pm : launch-editor contournable sous Windows (via better-auth > vitest).
  vite: ">=8.3.3"
  # GHSA-3f7j-7jwc-fxfj : injection de commande Windows dans services() (via inngest > @opentelemetry/auto-instrumentations-node > instrumentation-host-metrics).
  systeminformation: ">=5.33.16"
  # GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr (critiques), GHSA-p3m5-59mp-jv5r (eleve) :
  # next, pair optionnel d'inngest, installe d'office en 16.3.8 sous @inngest/test
  # (developpement). Aligne sur la version d'apps/web (D-166).
  "inngest>next": "16.4.5"
auditConfig:
  ignoreGhsas:
    # D-165 : glob sous gaxios@7.1.3 > rimraf@5 ; gaxios ne l'importe pas, jamais
    # charge a l'execution. Correctif (>=14.0.2) hors de la plage de rimraf (^10.3.7).
    - GHSA-3g3m-2fjr-6pw4
    # D-165 : minimatch sous ce meme glob (jamais charge) et sous typescript-estree
    # (developpement, motifs fixes de la configuration). Correctif (>=11.0.1) hors plage.
    - GHSA-g3hv-75wg-m249
